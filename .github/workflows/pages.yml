# Publish the game to GitHub Pages. The game builds on a developer's machine, and this workflow
# only deploys it:
#
# 1. `cargo xtask publish` builds both clients and pushes them to the branch `pages-build`, which
#    holds only the built game and is replaced whole each time. The page names the game server of
#    the local network for the multiplayer game.
# 2. Actions, "Publish the game", "Run workflow" deploys that branch to Pages.
#
# Before the first run, switch Pages on once: Settings, Pages, Source "GitHub Actions".
name: Publish the game

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. A new run waits for the running one and does not cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
