[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "0.20", features = ["webgpu"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = "1"
serde_json = "1"
sim = { path = "../sim" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "BinaryType",
  "CloseEvent",
  "Document",
  "Element",
  "ErrorEvent",
  "Event",
  "HtmlCanvasElement",
  "Location",
  "MessageEvent",
  "Navigator",
  "Performance",
  "Request",
  "Response",
  "Storage",
  "WebSocket",
  "Window",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
