[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The addresses of the machine, for the certificate. It needs only `libc`.
if-addrs = "0.15"
# The keys and the certificate are pure Rust. The default features of `rcgen` choose `ring`, which compiles C.
p256 = "0.14"
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1", features = ["std"] }
# A pre-release, accepted for a LAN. It replaces `ring` and `aws-lc-rs`, which compile C.
rustls-rustcrypto = "0.1.0-pre.0"
# The server knows nothing of the game. It needs `sim` only for `sim::room`, the frames of the bus.
sim = { path = "../sim" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"
