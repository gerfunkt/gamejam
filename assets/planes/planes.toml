# The plane models of the game. `cargo xtask models` turns each entry into web/assets/planes/<key>.glb.
#
# A pilot flies the entry with the most kills that does not exceed the kills of the pilot.
# Paths are relative to this file. `nose` and `up` name the axes of the model after the axis
# settings of its file apply. Write "not recorded" in a record field that nobody knows. Do not guess.
#
# `propeller` names the stretch of the nose in which the blades turn, in metres ahead of the middle of
# the plane, after the fit to the plane of the rules. The build takes out each separate piece of the
# model that lies wholly in the stretch, and the client draws a blur in the place of the blades.
# `cargo xtask models --preview` shows the result: the blades are gone, and a line marks the blur.

[[plane]]
# The model stands on its wheels, so pitch = -11.5 levels it: the propeller hub and the middle of the
# tail are at the same height. The wings of this model sit about 2 m ahead of the wing boxes of the
# rules. The plane is centred on its bounding box, so the boxes and the wings do not overlap.
key = "wwi-fighter"
name = "Sopwith Camel"
model = "wwi-fighter/model.fbx"
texture = "wwi-fighter/texture.png"
nose = "-X"
up = "+Y"
pitch = -11.5
kills = 0
# The two blades are one flat piece at the tip of the nose.
propeller = { from = 3.65, to = 3.9 }

[plane.record]
author = "AresLiCa (commit 96a0bc7 on the branch graphic_assets)"
service = "Meshy AI"
date = "2026-11-21"
prompt = "not recorded"
licence = "not recorded"

